<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>문명 전쟁 온라인</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f2c14e' stroke-width='2.2' stroke-linecap='round'><path d='M14.5 17.5L3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M9.5 17.5L21 6V3h-3L6.5 14.5M11 19l-6-6M8 16l-4 4'/></svg>">
<style>
:root{
  --bg:#0a0e18;--p1:#121826;--p2:#182033;--p3:#1f2940;--line:#273250;--line2:#33416a;
  --text:#e6eaf3;--mut:#8b96b2;--dim:#5d6886;--gold:#f0c35a;--gold2:#c9971f;
  --red:#ef5350;--green:#4ade80;--blue:#60a5fa;--orange:#fb923c;--violet:#a78bfa;
  --r:10px;--sh:0 12px 40px #0009;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow:hidden}
.ic{display:inline-block;vertical-align:-3px;flex:none}
button{font:inherit;color:inherit;background:var(--p3);border:1px solid var(--line2);border-radius:8px;padding:7px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center;transition:border-color .12s,background .12s}
button:hover:not(:disabled){border-color:var(--gold)}
button:disabled{opacity:.4;cursor:default}
button.pri{background:linear-gradient(#e7b443,#b98516);color:#1b1306;border-color:#f3d27e;font-weight:700}
button.ghost{background:transparent;border-color:transparent}
button.ghost:hover{background:var(--p3);border-color:var(--line2)}
button.danger{background:#3b1820;border-color:#7a2a36;color:#ffc9cf}
button.sm{padding:4px 8px;font-size:12px;border-radius:7px}
button.on{border-color:var(--gold);background:#3a3019}
input,select{font:inherit;color:var(--text);background:#0c1220;border:1px solid var(--line2);border-radius:8px;padding:7px 9px}
input[type=number]{width:62px;padding:4px 6px}
.mut{color:var(--mut)}.dim{color:var(--dim)}.pos{color:var(--green)}.neg{color:var(--red)}.goldc{color:var(--gold)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.screen{position:fixed;inset:0;display:none;overflow:auto}
.screen.on{display:block}
#game.screen{overflow:hidden}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 7px;border-radius:999px;background:var(--p3);color:var(--mut);border:1px solid var(--line);white-space:nowrap}
.tag.war{background:#3a1519;color:#ff9aa4;border-color:#6d2630}.tag.peace{background:#132a1d;color:#8ff0b0;border-color:#24543a}
.tag.ally{background:#1b2547;color:#a9c2ff;border-color:#34509a}.tag.open{background:#172a33;color:#8fd7f0;border-color:#2b5566}
.tag.nap{background:#262038;color:#c9b7ff;border-color:#463a6e}.tag.ai{background:#2a2140;color:#cbb6ff}.tag.on{background:#173323;color:#8ff0b0}
.tag.off{color:var(--dim)}.tag.prot{background:#16283c;color:#93c5fd;border-color:#2c4f78}
.bar{height:6px;background:#0007;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.sec{font-size:11px;color:var(--mut);margin:12px 0 6px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:7px;background:#0c1220;border:1px solid var(--line);font-size:12px;white-space:nowrap}
.chip.lack{border-color:#7a2a36;color:#ffb3bb}

/* 홈 */
#homeBg{position:fixed;inset:0;background:radial-gradient(1200px 600px at 20% 10%,#1d2a4d 0,transparent 60%),radial-gradient(900px 500px at 90% 90%,#2a1d3d 0,transparent 60%),var(--bg);z-index:-1}
.center{display:flex;align-items:center;justify-content:center;min-height:100%;padding:24px}
.card{background:var(--p1);border:1px solid var(--line);border-radius:16px;padding:26px;width:min(540px,100%);box-shadow:var(--sh)}
.brand{display:flex;align-items:center;gap:12px}
.brand h1{margin:0;font-size:26px;letter-spacing:.02em}
.brand .logo{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,#2b3a66,#151c30);display:grid;place-items:center;color:var(--gold);border:1px solid var(--line2)}
.wstat{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px;padding:10px 12px;border-radius:10px;background:var(--p2);border:1px solid var(--line);font-size:13px;color:var(--mut)}
.wstat b{color:var(--text)}
.civgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.civbtn{flex-direction:column;gap:2px;padding:8px 4px;font-size:13px}
.civbtn .dot{width:12px;height:12px;border-radius:50%}
.civbtn.on{border-color:var(--gold);background:#2b2614}
.howto{font-size:13px;color:var(--mut);line-height:1.7;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.howto b{color:var(--text)}

/* 게임 상단 */
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#top{position:absolute;left:0;right:0;top:0;z-index:6;display:flex;align-items:center;gap:6px;padding:6px 8px;background:linear-gradient(#0a0e18f5,#0a0e18e0);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.emp{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 6px;border-radius:9px;background:var(--p2);border:1px solid var(--line);font-weight:700;white-space:nowrap}
.emp .sw{width:18px;height:18px;border-radius:6px;border:2px solid #0008}
.stat{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:9px;background:var(--p2);border:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.stat.click{cursor:pointer}.stat.click:hover{border-color:var(--gold)}
.stat small{color:var(--mut);font-size:11px}
.navb{position:relative}
.navb .lbl{font-size:13px}
.badge{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;border-radius:9px;padding:0 5px;font-size:10px;line-height:16px;min-width:16px;text-align:center}
#stockbar{position:absolute;left:8px;top:50px;z-index:5;display:flex;gap:4px;flex-wrap:wrap;max-width:calc(100% - 380px)}
#stockbar .chip{background:#0c1220e6;cursor:pointer}
#stockbar .chip small{color:var(--green);font-size:10px}
#protBanner{position:absolute;left:50%;transform:translateX(-50%);top:84px;z-index:3;display:none;font-size:12px}

/* 오른쪽 패널 */
#panel{position:absolute;right:8px;top:50px;width:350px;max-height:calc(100% - 150px);overflow:auto;background:var(--p1);border:1px solid var(--line);border-radius:14px;z-index:5;display:none;box-shadow:var(--sh)}
#panel.on{display:block}
.ph{display:flex;align-items:center;gap:10px;padding:12px 12px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--p1);z-index:1}
.ph .big{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;border:2px solid #0006;flex:none}
.ph h3{margin:0;font-size:16px}
.ph .sub{font-size:12px;color:var(--mut)}
.pb{padding:10px 12px 14px}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.kv>div{background:var(--p2);border:1px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center;font-size:12px}
.kv b{display:block;font-size:14px}
.ulist{display:flex;flex-direction:column;gap:4px}
.urow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:9px;background:var(--p2);border:1px solid var(--line);cursor:pointer}
.urow.focus{border-color:var(--gold)}
.urow .tk{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid #0007;flex:none}
.urow .tk.civ{border-radius:8px}
.urow .nm{flex:1;min-width:0}
.urow .nm b{font-size:13px;display:block}
.urow .nm small{color:var(--mut);font-size:11px}
.urow input{width:18px;height:18px;accent-color:#e7b443}
.acts{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px}
.acts button{justify-content:flex-start;font-size:13px}
.acts button.wide{grid-column:span 2}
.tabs{display:flex;gap:4px;padding:8px 12px 0;border-bottom:1px solid var(--line)}
.tabs button{border-radius:8px 8px 0 0;border-bottom:none;background:transparent;border-color:transparent;color:var(--mut);padding:6px 10px;font-size:13px}
.tabs button.on{background:var(--p2);border-color:var(--line);color:var(--text)}
.plist{display:flex;flex-direction:column;gap:4px}
.pitem{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:9px;background:var(--p2);border:1px solid var(--line);cursor:pointer;text-align:left;width:100%;justify-content:flex-start}
.pitem.cur{border-color:var(--gold);background:#2a2414}
.pitem .nm{flex:1;min-width:0}
.pitem .nm b{display:block;font-size:13px;font-weight:600}
.pitem .nm small{color:var(--mut);font-size:11px;display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.pitem .cost{font-size:11px;color:var(--mut);text-align:right;white-space:nowrap}
.slots{display:flex;flex-direction:column;gap:5px}
.slot{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:9px;background:var(--p2);border:1px dashed var(--line2)}
.slot.full{border-style:solid}
.slot select{flex:1;padding:4px 6px;font-size:12px}

/* 하단 */
#bottom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;z-index:5}
#endBtn{font-size:16px;padding:12px 20px;min-width:200px;border-radius:12px}
#endBtn.wait{background:var(--p3);color:var(--text);border-color:var(--line2);font-weight:600}
#mini{position:absolute;left:10px;bottom:10px;z-index:4;border:1px solid var(--line2);border-radius:10px;background:#05070d;cursor:pointer;touch-action:none;box-shadow:var(--sh)}
#feed{position:absolute;left:10px;width:min(430px,55%);font-size:12.5px;z-index:3;cursor:pointer;display:flex;flex-direction:column;gap:3px}
#feed div{background:#0a0e18d9;border:1px solid var(--line);border-left:3px solid var(--gold2);padding:4px 9px;border-radius:7px}
#feed div.old{opacity:.5}
#tileTip{position:absolute;z-index:4;pointer-events:none;background:#0a0e18f0;border:1px solid var(--line2);border-radius:8px;padding:4px 8px;font-size:12px;display:none;white-space:nowrap}

/* 모달 */
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:20;padding:12px;backdrop-filter:blur(2px)}
.modal.on{display:flex}
.mbox{background:var(--p1);border:1px solid var(--line);border-radius:16px;max-width:min(1100px,100%);max-height:100%;overflow:auto;position:relative;width:100%;box-shadow:var(--sh)}
.mhead{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--p1);z-index:2}
.mhead h2{margin:0;font-size:17px;display:flex;align-items:center;gap:8px}
.mbody{padding:14px 16px}
.tech{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.tcol{display:flex;flex-direction:column;gap:8px;min-width:180px}
.tc{border:1px solid var(--line);border-radius:10px;padding:9px;background:var(--p2);font-size:12px}
.tc b{font-size:14px;display:flex;align-items:center;gap:6px}
.tc.known{background:#122419;border-color:#24543a}
.tc.avail{cursor:pointer;border-color:#4a5d97}.tc.avail:hover{border-color:var(--gold)}
.tc.res{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;background:#2a2414;cursor:pointer}
.tc.locked{opacity:.45}
.tc .ul{margin-top:5px;color:var(--mut);display:flex;flex-wrap:wrap;gap:4px}
.dl{display:flex;flex-direction:column;gap:8px}
.civrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--p2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.civrow .sw{width:34px;height:34px;border-radius:9px;border:2px solid #0007}
.civrow .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.civrow .meta{font-size:12px;color:var(--mut);display:flex;gap:12px;flex-wrap:wrap;margin-top:4px}
.civrow .btns{display:flex;flex-direction:column;gap:5px}
.opbar{width:110px;height:6px;border-radius:4px;background:linear-gradient(90deg,#ef5350,#7a7f8f 50%,#4ade80);position:relative}
.opbar i{position:absolute;top:-3px;width:3px;height:12px;background:#fff;border-radius:2px}
.dealgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dealcol{background:var(--p2);border:1px solid var(--line);border-radius:12px;padding:12px}
.dealcol h4{margin:0 0 8px;font-size:14px}
.drow{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;font-size:12.5px;padding:3px 0}
.drow .h{color:var(--mut);font-size:11px;text-align:center}
.clauses{display:flex;gap:6px;flex-wrap:wrap}
.clauses label{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:9px;background:var(--p2);border:1px solid var(--line);cursor:pointer;font-size:13px}
.clauses input{accent-color:#e7b443}
.mtable{width:100%;border-collapse:collapse;font-size:13px}
.mtable th{color:var(--mut);font-weight:600;font-size:11px;text-align:left;padding:6px;border-bottom:1px solid var(--line)}
.mtable td{padding:7px 6px;border-bottom:1px solid var(--line)}
.mtable td.n{text-align:right;font-variant-numeric:tabular-nums}
.prop{background:var(--p2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
/* 전투 */
#btlCv{width:100%;height:280px;display:block;border-radius:12px;background:radial-gradient(ellipse at center,#26324f 0,#121826 70%);border:1px solid var(--line)}
.tacs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tac{flex-direction:column;align-items:flex-start;text-align:left;padding:10px;gap:4px}
.tac b{display:flex;align-items:center;gap:6px;font-size:15px}
.tac small{color:var(--mut);font-size:11.5px;line-height:1.35}
.hint{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:#20294a;border:1px solid #34509a;font-size:13px;margin-top:10px}
.rres{padding:8px 10px;border-radius:10px;background:var(--p2);border:1px solid var(--line);font-size:13px;margin-top:8px}
#toast{position:fixed;left:50%;top:62px;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:#182033f5;border:1px solid var(--line2);border-left:3px solid var(--gold);padding:8px 14px;border-radius:10px;font-size:13.5px;box-shadow:var(--sh);animation:fade 3.2s forwards}
#toast div.err{border-left-color:var(--red)}
@keyframes fade{0%{opacity:0;transform:translateY(-6px)}8%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#conn{position:fixed;inset:0;background:#000b;z-index:40;display:none;align-items:center;justify-content:center;font-size:17px;text-align:center;padding:20px}
#conn.on{display:flex}
#chatPanel{position:absolute;left:10px;top:84px;width:min(340px,calc(100% - 20px));background:var(--p1);border:1px solid var(--line);border-radius:14px;z-index:7;display:none;box-shadow:var(--sh)}
#chatPanel.on{display:block}
.chatbox{height:240px;overflow:auto;padding:8px 12px;font-size:13px}
.chatbox div{margin:3px 0}
@media (max-width:760px){
  #top{flex-wrap:wrap;gap:4px;padding:4px 6px}
  .navb .lbl,.hideM{display:none}
  #stockbar{display:none}
  #panel{left:6px;right:6px;width:auto;top:auto;bottom:120px;max-height:48%}
  #feed{width:calc(100% - 20px)}
  #feed div:nth-child(-n+4){display:none}
  #endBtn{min-width:150px;font-size:14px;padding:10px 14px}
  .civgrid{grid-template-columns:repeat(2,1fr)}
  .dealgrid{grid-template-columns:1fr}
  .tacs{grid-template-columns:1fr}
  #btlCv{height:220px}
  #protBanner{top:auto;bottom:66px}
}
</style>
</head>
<body>
<div id="homeBg"></div>

<div class="screen on" id="home"><div class="center"><div class="card">
  <div class="brand"><div class="logo" id="logo"></div><div><h1>문명 전쟁 온라인</h1><div class="mut">모두가 하나의 거대한 세계에서 살아가는 문명 전략 게임</div></div></div>
  <div class="wstat" id="wstat">세계 정보를 불러오는 중…</div>
  <div id="contBox" style="display:none;margin-top:14px">
    <button class="pri" id="contBtn" style="width:100%;font-size:16px;padding:12px">내 제국으로 돌아가기</button>
    <div class="mut" style="text-align:center;margin-top:8px;font-size:12px">또는 아래에서 새 문명으로 시작</div>
  </div>
  <div class="sec" style="margin-top:18px">지도자 이름</div>
  <input id="nameIn" placeholder="12자 이내" maxlength="12" style="width:100%">
  <div class="sec">문명 (도시 이름에 반영)</div>
  <div class="civgrid" id="civPick"></div>
  <button class="pri" id="enterBtn" style="width:100%;margin-top:14px;padding:11px">세계에 입장하기</button>
  <div class="howto" id="howto"></div>
</div></div></div>

<div class="screen" id="game">
  <canvas id="cv"></canvas>
  <div id="top">
    <div class="emp" id="hEmp"></div>
    <div class="stat" id="hTurn"></div>
    <div class="stat" id="hGold"></div>
    <div class="stat" id="hSci"></div>
    <div class="stat click hideM" id="hRes"></div>
    <div class="sp"></div>
    <div class="stat hideM" id="hOnline"></div>
    <button class="ghost navb" id="bStock" style="display:none"></button>
    <button class="ghost navb" id="bTech"></button>
    <button class="ghost navb" id="bDip"></button>
    <button class="ghost navb" id="bMarket"></button>
    <button class="ghost navb" id="bRank"></button>
    <button class="ghost navb" id="bChat"></button>
    <button class="ghost navb" id="bMenu"></button>
  </div>
  <div id="stockbar"></div>
  <div id="protBanner" class="tag prot"></div>
  <div id="panel"></div>
  <div id="chatPanel"><div class="mhead" style="padding:10px 12px"><b>세계 채팅</b><div class="sp"></div><button class="ghost sm" id="chatX"></button></div>
    <div class="chatbox" id="gChat"></div>
    <div class="row" style="padding:8px 10px;border-top:1px solid var(--line)"><input id="gChatIn" placeholder="메시지" style="flex:1" maxlength="200"><button id="gChatSend" class="sm">전송</button></div></div>
  <div id="feed"></div>
  <canvas id="mini"></canvas>
  <div id="bottom"><button id="endSmall" class="sm"></button><button id="endBtn" class="pri">준비</button></div>
  <div id="tileTip"></div>
</div>

<div class="modal" id="mTech"><div class="mbox"><div class="mhead"><h2 id="techTitle"></h2><div class="sp"></div><button class="ghost" data-close></button></div><div class="mbody"><div class="mut" id="techInfo" style="margin-bottom:12px"></div><div class="tech" id="techTree"></div></div></div></div>
<div class="modal" id="mDip"><div class="mbox" style="max-width:760px"><div class="mhead"><h2 id="dipTitle"></h2><div class="sp"></div><button class="ghost" data-close></button></div>
  <div class="tabs" id="dipTabs"></div><div class="mbody" id="dipBody"></div></div></div>
<div class="modal" id="mDeal"><div class="mbox" style="max-width:760px"><div class="mhead"><h2 id="dealTitle"></h2><div class="sp"></div><button class="ghost" data-close></button></div><div class="mbody" id="dealBody"></div></div></div>
<div class="modal" id="mMarket"><div class="mbox" style="max-width:720px"><div class="mhead"><h2 id="mktTitle"></h2><div class="sp"></div><button class="ghost" data-close></button></div><div class="mbody" id="mktBody"></div></div></div>
<div class="modal" id="mRank"><div class="mbox" style="max-width:560px"><div class="mhead"><h2 id="rankTitle"></h2><div class="sp"></div><button class="ghost" data-close></button></div><div class="mbody"><div class="dl" id="rankList"></div></div></div></div>
<div class="modal" id="mLog"><div class="mbox" style="max-width:560px"><div class="mhead"><h2 id="logTitle"></h2><div class="sp"></div><button class="ghost" data-close></button></div><div class="mbody" id="logList" style="font-size:13px;line-height:1.8"></div></div></div>
<div class="modal" id="mMenu"><div class="mbox" style="max-width:360px"><div class="mhead"><h2>메뉴</h2><div class="sp"></div><button class="ghost" data-close></button></div>
